<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0e0d0f" />
        <meta name="color-scheme" content="dark" />
        <meta name="description" content="Your Spotify top tracks and artists from the last 4 weeks, 6 months and all time, and how they move." />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="manifest" href="/manifest.json" />
        <title>Jossify · Your listening, ranked</title>
        <script>
            // Warm up Spotify's API and image servers while the app downloads, only on the signed-in
            // ranking: the landing page and the demo never talk to Spotify, so they don't pay for it.
            if (location.pathname === '/TopMusic') {
                var origins = [
                    ['https://api.spotify.com', true],
                    ['https://i.scdn.co', false],
                ];
                // Coming back from Spotify's sign-in: the code is exchanged for a token first.
                if (/[?&]code=/.test(location.search)) origins.unshift(['https://accounts.spotify.com', true]);
                origins.forEach(function (origin) {
                    var link = document.createElement('link');
                    link.rel = 'preconnect';
                    link.href = origin[0];
                    // API calls are CORS requests; cover images are plain image loads.
                    if (origin[1]) link.crossOrigin = 'anonymous';
                    document.head.appendChild(link);
                });
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
